<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1420">
<title>Нет сети — СметаПро</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background: #0e1420; color: #eef2f8;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Inter, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 21px; margin: 0; }
  p { margin: 0; color: #94a0b3; font-size: 15px; line-height: 1.45; }
  button {
    font: inherit; font-weight: 600; font-size: 16px;
    min-height: 52px; padding: 0 28px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #5f8bff, #7a63ff); color: #fff; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  svg { opacity: 0.9; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <!-- мини-иллюстрация «офлайн» в стиле знака -->
  <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3565ec"/><stop offset="1" stop-color="#5b54e8"/>
    </linearGradient></defs>
    <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#g)" opacity="0.22"/>
    <path d="M28 52 a 20 20 0 0 1 40 0" fill="none" stroke="#5f8bff" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 60 a 10 10 0 0 1 20 0" fill="none" stroke="#5f8bff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle cx="48" cy="68" r="4.5" fill="#5f8bff"/>
    <line x1="26" y1="26" x2="70" y2="70" stroke="#eef2f8" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>Нет сети — смета подождёт</h1>
  <p>Проверьте соединение. Всё, что вы создали,<br>никуда не денется.</p>
  <button onclick="location.reload()">Повторить</button>
</body>
