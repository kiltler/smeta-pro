# Локальная разработка «СметаПро»: API + PostgreSQL 16 + MinIO
# Запуск: cp .env.example .env && docker compose up --build
services:
  api:
    build: .
    env_file: .env
    environment:
      # Внутри docker-сети всегда обращаемся к сервисам по их именам
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:-smeta}@db:5432/${POSTGRES_DB:-smeta}
      S3_ENDPOINT: minio:9000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Живая перезагрузка кода при разработке
      - ./app:/code/app
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./scripts:/code/scripts
      - ./tests:/code/tests
      - ./pytest.ini:/code/pytest.ini
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-slim
    working_dir: /app
    environment:
      VITE_API_PROXY: http://api:8000
      # Не ходить в сеть без необходимости при уже установленных зависимостях
      npm_config_audit: "false"
      npm_config_fund: "false"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smeta}
      POSTGRES_DB: ${POSTGRES_DB:-smeta}
    ports:
      # Наружу — только для подключения IDE/psql с хоста
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smeta} -d ${POSTGRES_DB:-smeta}"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"                              # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"       # веб-консоль
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
