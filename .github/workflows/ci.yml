# CI: тесты на каждый PR; пуш в main → тесты + автодеплой на staging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smeta
          POSTGRES_PASSWORD: smeta
          POSTGRES_DB: smeta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smeta" --health-interval 5s
          --health-timeout 3s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные зависимости WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core

      - name: Python-зависимости
        run: pip install -r requirements.txt

      - name: Ожидание MinIO
        run: for i in $(seq 1 20); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done

      - name: Тесты
        env:
          DATABASE_URL: postgresql+psycopg://smeta:smeta@localhost:5432/smeta
          S3_ENDPOINT: localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Сборка фронтенда (смок)
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: staging-deploy
    steps:
      - name: Деплой на staging по SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/smeta-pro
            git fetch origin main
            git reset --hard origin/main
            ./deploy/deploy.sh
