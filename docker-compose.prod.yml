# Prod-стек. Изолирован от staging: своё имя проекта, тома, env-файл,
# порт 127.0.0.1:8201 (наружу только через nginx).
# Запуск только через deploy/promote.sh (автодамп БД перед миграцией!).
name: smeta-prod

services:
  api:
    # prod-current тегируют promote.sh/rollback.sh — ад-хок команды
    # (logs, exec, backup) работают без переменной IMAGE
    image: ${IMAGE:-smeta-pro:prod-current}
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:?задайте в .env.prod}@db:5432/${POSTGRES_DB:-smeta}
      S3_ENDPOINT: minio:9000
    ports:
      - "127.0.0.1:8201:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-smeta}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smeta} -d ${POSTGRES_DB:-smeta}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?задайте в .env.prod}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте в .env.prod}
    command: server /data
    volumes:
      - prod_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  prod_pgdata:
  prod_minio:
